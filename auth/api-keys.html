<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>API keys · 2030B Auth</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    colors:{ blue:{500:'#3b82f6',600:'#2563eb'}, cyan:{500:'#06b6d4',600:'#0891b2'}, emerald:{500:'#22c55e',600:'#16a34a'} },
    fontFamily:{ sans:['Inter','system-ui','sans-serif'], display:['"Space Grotesk"','"Inter"','sans-serif'] }
  }}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="auth.css">

<script src="../js/logos.js"></script>
<script src="../js/config.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/shell.js" defer></script>
<script src="../js/main.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-prefix="../" class="bg-slate-50 dark:bg-[#0a0f1f] text-slate-800 dark:text-slate-200 antialiased font-sans">

<div data-shell></div>

<main class="pt-28 pb-20">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Sign-in gate -->
    <section id="keysGate" class="b30-card max-w-md mx-auto p-6 text-center hidden">
      <span data-b30-icon="auth" data-size="64" class="inline-block"></span>
      <h1 class="mt-3 font-display font-extrabold text-2xl" data-i18n="keys.signinTitle">Sign in to manage API keys</h1>
      <a href="index.html" class="wb-btn-primary rounded-lg px-5 py-2.5 text-sm font-semibold inline-flex items-center gap-2 mt-4">
        <i data-lucide="log-in" class="w-4 h-4"></i> <span data-i18n="cta.signIn">Sign in</span>
      </a>
    </section>

    <!-- Panel -->
    <section id="keysPanel" class="hidden">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="font-display font-extrabold text-3xl" data-i18n="keys.title">Auth API keys</h1>
          <p class="text-sm opacity-70 mt-1" data-i18n="keys.subtitle">Issue keys to embed the 2030B sign-in popup on external domains.</p>
        </div>
        <button id="newKey" class="wb-btn-primary rounded-xl px-5 py-2.5 font-semibold inline-flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="keys.new">New API key</span>
        </button>
      </div>

      <!-- Snippet box -->
      <div class="b30-card mt-6">
        <h3 class="font-display font-bold flex items-center gap-2"><i data-lucide="code-2" class="w-4 h-4 text-blue-500"></i> <span data-i18n="keys.embed.title">Embed snippet</span></h3>
        <p class="text-sm opacity-70 mt-1" data-i18n="keys.embed.body">Drop this on any HTML page to open 2030B sign-in in a popup using your API key:</p>
        <pre id="embedSnippet" class="bg-slate-100 dark:bg-white/5 rounded-xl p-4 mt-3 text-xs overflow-x-auto"><code></code></pre>
      </div>

      <!-- Keys table -->
      <div class="b30-card mt-6">
        <h3 class="font-display font-bold flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4 text-emerald-500"></i> <span data-i18n="keys.yours">Your keys</span></h3>
        <div id="keysList" class="mt-4 space-y-3"></div>
        <p id="keysEmpty" class="text-sm opacity-70 hidden" data-i18n="keys.empty">No API keys yet — create one to start.</p>
      </div>
    </section>

  </div>
</main>

<div data-shell-foot></div>

<script src="../js/enhancements.js" defer></script>
<script>
(function () {
  function whenReady (fn) {
    Promise.all([
      new Promise(r => window.B30Config.onLoad(r)),
      window.B30I18n.ready(),
      window.B30Store.ready()
    ]).then(([c]) => fn(c));
  }

  function showGate () { document.getElementById('keysGate').classList.remove('hidden'); document.getElementById('keysPanel').classList.add('hidden'); }
  function showPanel () { document.getElementById('keysGate').classList.add('hidden'); document.getElementById('keysPanel').classList.remove('hidden'); }

  async function refresh () {
    const ses = window.B30Store.getSession();
    if (!ses) return showGate();
    showPanel();
    const list = document.getElementById('keysList');
    const empty = document.getElementById('keysEmpty');
    const keys = await window.B30Store.listApiKeys(ses.id);
    if (!keys.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    list.innerHTML = keys.map(k => `
      <div class="rounded-xl border border-slate-200/60 dark:border-white/10 p-4 flex flex-wrap items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="b30-pill ${k.enabled ? 'b30-pill-verified' : 'b30-pill-rejected'}">
              <i data-lucide="${k.enabled?'check':'pause'}" class="w-3 h-3"></i> ${k.enabled?'Active':'Disabled'}
            </span>
            <span class="font-semibold truncate">${k.label || 'Untitled'}</span>
          </div>
          <div class="mt-1 flex items-center gap-2">
            <code class="text-xs bg-slate-100 dark:bg-white/5 px-2 py-1 rounded" id="key-${k.id}">${k.key}</code>
            <button class="text-xs text-blue-500 hover:underline" data-copy="${k.key}"><i data-lucide="copy" class="w-3 h-3 inline"></i> copy</button>
          </div>
          <p class="text-xs opacity-60 mt-1">Scopes: ${(k.scopes||[]).join(', ')} · Origins: ${(k.origins||['*']).join(', ')}</p>
          <p class="text-xs opacity-60">Created ${new Date(k.created_at).toLocaleString()}${k.last_used?` · Last used ${new Date(k.last_used).toLocaleString()}`:''}</p>
        </div>
        <div class="flex items-center gap-2">
          <button class="wb-btn-ghost rounded-lg px-3 py-1.5 text-xs font-semibold" data-toggle="${k.id}">${k.enabled?'Disable':'Enable'}</button>
          <button class="wb-btn-ghost rounded-lg px-3 py-1.5 text-xs font-semibold text-rose-500" data-del="${k.id}"><i data-lucide="trash-2" class="w-3 h-3 inline"></i> delete</button>
        </div>
      </div>`).join('');

    // Wire actions
    list.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); Swal.fire({icon:'success',timer:900,showConfirmButton:false,title:'Copied'}); } catch(e){}
    }));
    list.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
      const rec = keys.find(x => x.id === b.dataset.toggle);
      await window.B30Store.updateApiKey(b.dataset.toggle, { enabled: !rec.enabled });
      refresh();
    }));
    list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      const ok = await Swal.fire({ icon:'warning', title:'Delete this API key?', showCancelButton:true, confirmButtonText:'Delete', confirmButtonColor:'#dc2626' });
      if (!ok.isConfirmed) return;
      await window.B30Store.deleteApiKey(b.dataset.del);
      refresh();
    }));

    if (window.lucide) lucide.createIcons();

    // Build embed snippet using first active key
    const first = keys.find(x => x.enabled) || keys[0];
    if (first) {
      const origin = location.origin;
      const snippet = `<script>
(function(){
  function openB30Auth(){
    var w=window.open('${origin}/auth/index.html?popup=1&api_key=${first.key}&origin='+encodeURIComponent(location.origin),'b30auth','width=440,height=720');
    window.addEventListener('message', function(e){
      if(!e.data || e.data.type!=='b30:auth') return;
      console.log('2030B auth result:', e.data);
      // → use e.data.token to call your backend, then close.
    });
  }
  window.openB30Auth = openB30Auth;
})();
<\/script>
<button onclick="openB30Auth()">Sign in with 2030B</button>`;
      document.querySelector('#embedSnippet code').textContent = snippet;
    } else {
      document.querySelector('#embedSnippet code').textContent = '// Create an API key to see your embed snippet.';
    }
  }

  document.getElementById('newKey').addEventListener('click', async () => {
    const ses = window.B30Store.getSession();
    if (!ses) return showGate();
    const { value: form } = await Swal.fire({
      title: 'New API key',
      html:
        '<input id="kLabel" class="swal2-input" placeholder="Label (e.g. my-site.com)"/>' +
        '<input id="kOrigins" class="swal2-input" placeholder="Allowed origins (comma sep, * for any)"/>' +
        '<input id="kScopes" class="swal2-input" placeholder="Scopes (default: auth:read,auth:popup)"/>',
      preConfirm: () => ({
        label:   document.getElementById('kLabel').value || 'API key',
        origins: (document.getElementById('kOrigins').value || '*').split(',').map(s=>s.trim()).filter(Boolean),
        scopes:  (document.getElementById('kScopes').value || 'auth:read,auth:popup').split(',').map(s=>s.trim()).filter(Boolean)
      })
    });
    if (!form) return;
    const rec = await window.B30Store.createApiKey({ userId: ses.id, ...form });
    Swal.fire({ icon:'success', title:'API key created', html:`<code style="font-size:.75rem;word-break:break-all">${rec.key}</code>` });
    refresh();
  });

  whenReady(refresh);
})();
</script>
</body>
</html>
